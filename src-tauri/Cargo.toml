[package]
name = "gh-dashboard"
version = "0.1.0"
description = "GitHub Copilot 稼働ダッシュボード / プロジェクトダッシュボード"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
# Tauri v2 はライブラリ crate を要求する
name = "gh_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "7"

[target.'cfg(windows)'.dependencies]
# Job Object (KILL_ON_JOB_CLOSE) 用。使用は platform/win_job.rs に隔離する (ADR-0011)
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
# 既定では何も有効にしない
default = []

[profile.release]
# ハング時のダンプ解析にデバッグシンボルが要る (NFR-25)
debug = 1
strip = "none"
codegen-units = 1
lto = true
